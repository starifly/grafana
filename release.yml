name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (example: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64

          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Validate version
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version format invalid"
            echo "Example: v1.0.0"
            exit 1
          fi

      - name: Create tag
        run: |
          VERSION="${{ github.event.inputs.version }}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag $VERSION
          git push origin $VERSION

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ github.event.inputs.version }}"

          mkdir -p dist

          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=$VERSION" \
            -o dist/grafana

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version }}"

          PKG_NAME=grafana-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}

          mkdir -p package/$PKG_NAME

          cp dist/grafana package/$PKG_NAME/

          [ -f README.md ] && cp README.md package/$PKG_NAME/
          [ -f LICENSE ] && cp LICENSE package/$PKG_NAME/

          tar -czf ${PKG_NAME}.tar.gz -C package $PKG_NAME

      - name: Generate checksum
        run: |
          sha256sum *.tar.gz > sha256sum.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            *.tar.gz
            sha256sum.txt
